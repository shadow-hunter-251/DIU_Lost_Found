{% extends 'base.html' %}

{% block title %}
    Delete {{ item.title }}
{% endblock %}

{% block content %}

<section class="py-20">

    <div class="max-w-lg mx-auto px-6">

        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8 text-center">

            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                !
            </div>


            <h1 class="text-2xl font-bold text-slate-900 mt-6">
                Delete This Item?
            </h1>


            <p class="text-slate-500 mt-3">
                Are you sure you want to delete
                <span class="font-semibold text-slate-800">
                    "{{ item.title }}"
                </span>?
            </p>


            <p class="text-sm text-red-500 mt-3">
                This action cannot be undone.
            </p>


            <form method="POST" class="mt-8">

                {% csrf_token %}

                <div class="flex gap-4">

                    <a
                        href="{% url 'item_detail' item.id %}"
                        class="flex-1 text-center border border-slate-300 font-semibold py-3 rounded-lg hover:bg-slate-50">

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="flex-1 bg-red-600 text-white font-semibold py-3 rounded-lg hover:bg-red-700">

                        Delete

                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
